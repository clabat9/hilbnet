name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the tested versions (CPU build of PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.17.1 pandas==3.0.2 h5py==3.16.0 \
            matplotlib==3.10.8 torch-geometric==2.7.0 pyyaml==6.0.3 pytest==9.0.2
          python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest -ra
      - name: README commands that need no data
        run: |
          python scripts/bundle_transport_recovery.py --config scripts/configs/synthetic/transport_recovery_smoke.yaml --device cpu
          python scripts/bundle_operator_convergence.py --config scripts/configs/synthetic/operator_convergence_smoke.yaml --device cpu
          python scripts/bundle_make_figures.py --operator results/paper/operator_convergence.json --out_dir figures
