# HilbNet circulant transport — paper Table 2.
#
# Per-edge circulant transport: P_e = F* diag(e^{i φ_e,k}) F. The phase
# parameter φ_e,k corresponds to per-frequency propagation delay between
# sensor pairs — physically meaningful on a road network where slowdowns
# propagate along edges with lag set by road geometry and current speed.
#
# Same config used for both METR-LA and PEMS-BAY; the runner overrides the
# `dataset:` field below via the `--dataset` CLI flag.

model: hilbnet
dataset: metr-la

window_in: 12
window_out: 12
add_time_of_day: true
threshold_k: 0.1

features: [2, 16, 32]
kappa: [2, 2]

batch_size: 32
epochs: 150
patience: 20
lr: 5.0e-3
weight_decay: 0.0
dropout: 0.0
clip_grad_norm: 5.0     # DCRNN convention; safety net (no-op for HilbNet)

transport_param: circulant
transport_init: identity_plus_noise
transport_lr: 5.0e-3
num_bands: null         # full (T_in - 1) // 2 = 5 free phases per edge at T_in=12
num_reflections: 8      # unused by circulant; kept for cfg parity

reg_param: 0.01
kernel: rbf
kernel_param: 1.0
