# Frozen-identity HilbNet — trivial connection on the Hilbert bundle.
#
# Reduces to a standard GCN: sheaf Laplacian degenerates to the graph
# Laplacian acting independently per timestep. Used as the GCN baseline row
# in paper Table 2.
#
# Same config used for both METR-LA and PEMS-BAY; the runner overrides the
# `dataset:` field below via the `--dataset` CLI flag.

model: hilbnet
dataset: metr-la

window_in: 12
window_out: 12
add_time_of_day: true
threshold_k: 0.1

features: [2, 16, 32]
kappa: [2, 2]

batch_size: 32
epochs: 150
patience: 20
lr: 5.0e-3
weight_decay: 0.0
dropout: 0.0
clip_grad_norm: 5.0     # DCRNN convention; safety net (no-op for HilbNet)

# Transports allocated as direct + identity, then frozen via transport_lr=0.
transport_param: direct
transport_init: identity
transport_lr: 0
num_reflections: 8

# No smooth-section regularizer needed when transports are frozen at identity
# (the regularizer pushes transports toward alignment; identity is already
# the boundary case).
reg_param: 0.0
kernel: rbf
kernel_param: 1.0
