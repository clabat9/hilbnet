# Paper config — synthetic transport recovery (Table 1).
# Sweeps the three HilbNet transport variants (direct / circulant / frozen_id)
# across an n_nodes ladder; each (variant, n_nodes, seed) becomes one row.
# Each row records the Monte-Carlo and deterministic ("Det.") training minima
# and the analytical plateau ("Theory").

n_dim: 4                 # Sym(n=4): fiber dim m = 10
n_grid: [16, 32, 64, 128, 256]

# Graph construction
graph_type: knn
distance_type: wasserstein
k_neighbors: 8
edge_weight_sigma: 1.0
eigenvalue_range: [0.5, 2.0]   # informational: the sampler's default range is used

# Levi-Civita parallel-transport ODE (closed-form ground truth)
n_transport_steps: 50

# Coordinate convention
rescale: true

# Variants — names match BundleTransportModule.SUPPORTED.
variants: [direct, circulant, frozen_id]
num_reflections: 16      # ~1.6m at m=10 — comfortable headroom over the
                         # Cartan-Dieudonné minimum to escape Householder local
                         # minima.
num_bands: null          # circulant: null = full ((m-1)//2 phases)
transport_init: identity_plus_noise

# Training
epochs: 5000             # hard cap; patience usually trips well before this
patience: 600            # early-stop after this many epochs with no new best loss
batch_size: 256
lr: 5.0e-3
weight_decay: 0.0
log_every: 200

seeds: [0, 1, 2]
